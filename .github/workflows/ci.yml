name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, and unit tests
        run: npm run check
      - name: Validate supporting research
        run: npm run validate:research
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static export and run desktop/mobile journeys
        run: npm run test:e2e -- --workers=2
      - name: Verify Pages marker
        run: test -f out/.nojekyll
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
